<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - Alif's Birthday Archive</title>
  <style>
    :root {
      --navy: #0b2a5b; --blue: #3b82f6; --blue-deep: #1d4ed8; --cyan: #22d3ee;
      --purple: #a78bfa; --mint: #4ade80; --pink: #f472b6; --line: rgba(59,130,246,.25);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100vh; color: var(--navy);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
      background: linear-gradient(160deg, #eaf8ff 0%, #bfe6ff 45%, #8ec5ff 100%) fixed;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .muted { color: #3f5f8f; font-size: .9rem; }
    .panel {
      background: rgba(255,255,255,.75); border: 1px solid var(--line); border-radius: 20px;
      padding: 18px; margin-top: 16px; box-shadow: 0 10px 30px rgba(59,130,246,.15);
    }
    label { display: block; font-weight: 600; margin-top: 12px; }
    input, select {
      width: 100%; font: inherit; color: var(--navy); background: #fff;
      border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-top: 6px; outline: none;
    }
    input:focus, select:focus { border-color: var(--blue); }
    button {
      font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
      color: #fff; background: linear-gradient(135deg, var(--blue-deep), var(--blue) 55%, var(--cyan));
    }
    button.full { width: 100%; margin-top: 16px; }
    button:disabled { opacity: .5; }
    .error { color: #b42318; font-weight: 600; margin-top: 10px; }
    .bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .bar button { padding: 8px 12px; font-size: .85rem; background: #64748b; }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .count { margin: 14px 2px 4px; font-weight: 700; }

    /* =====================================================
       KARTU PESAN (lebih pekat, garis menyala)
       ===================================================== */
    .msg {
      position: relative; overflow: hidden; margin-top: 16px; padding: 18px 18px 16px;
      border-radius: 22px; color: var(--navy); border: 2.5px solid transparent;
    }
    .who { position: relative; z-index: 1; font-size: 1.2rem; font-weight: 800; margin: 0; word-break: break-word; }
    .meta { position: relative; z-index: 1; font-size: .8rem; font-weight: 600; color: #1e3a8a; margin: 2px 0 10px; }
    .body { position: relative; z-index: 1; white-space: pre-wrap; word-break: break-word; margin: 0; font-weight: 500; }
    .del {
      position: relative; z-index: 1; margin-top: 12px; padding: 7px 14px; font-size: .8rem;
      background: #fff; color: #b42318; border: 1.5px solid #b42318;
    }

    /* Nama biasa: biru / cyan / ungu / hijau muda (TANPA pink), warna pekat + garis menyala */
    .msg.c0 { background: linear-gradient(145deg, #bfdbfe, #60a5fa); border-color: #2563eb; box-shadow: 0 0 0 1px #93c5fd, 0 0 18px rgba(37,99,235,.6); }
    .msg.c1 { background: linear-gradient(145deg, #a5f3fc, #22d3ee); border-color: #0891b2; box-shadow: 0 0 0 1px #67e8f9, 0 0 18px rgba(6,182,212,.65); }
    .msg.c2 { background: linear-gradient(145deg, #ddd6fe, #a78bfa); border-color: #7c3aed; box-shadow: 0 0 0 1px #c4b5fd, 0 0 18px rgba(124,58,237,.55); }
    .msg.c3 { background: linear-gradient(145deg, #bbf7d0, #4ade80); border-color: #16a34a; box-shadow: 0 0 0 1px #86efac, 0 0 18px rgba(22,163,74,.55); }

    /* SPESIAL: kilau lewat + berdenyut menyala */
    .msg.rania::before, .msg.azfa::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 50%; z-index: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.65) 50%, transparent 80%);
      transform: skewX(-18deg); animation: sweep 3.6s ease-in-out infinite;
    }
    .msg.rania::after, .msg.azfa::after {
      content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(circle at 88% 14%, rgba(255,255,255,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 74% 30%, rgba(255,255,255,.8) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 94% 56%, rgba(255,255,255,.85) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 84%, rgba(255,255,255,.9) 0 1.5px, transparent 2.5px),
        radial-gradient(circle at 60% 92%, rgba(255,255,255,.7) 0 2px, transparent 3px);
      animation: twinkle 2.4s ease-in-out infinite;
    }

    /* Rania / Ran / Rann = BIRU + PINK */
    .msg.rania {
      background: linear-gradient(135deg, #3b82f6 0%, #93c5fd 38%, #f9a8d4 68%, #ec4899 100%);
      border-color: #ec4899;
      animation: glowPink 2.6s ease-in-out infinite;
    }
    /* Azfa / YourName / Your Name = BIRU + CYAN */
    .msg.azfa {
      background: linear-gradient(135deg, #2563eb 0%, #60a5fa 38%, #67e8f9 70%, #06b6d4 100%);
      border-color: #06b6d4;
      animation: glowCyan 2.6s ease-in-out infinite;
    }
    .msg.rania .who, .msg.azfa .who { font-size: 1.3rem; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
    .msg.rania .meta, .msg.azfa .meta { color: #0b2a5b; }

    /* =====================================================
       PALING SPESIAL: Alif / NameGw / Name Gw (pesan untuk diri sendiri)
       3 warna: biru muda + cyan + biru cyber/neon
       ===================================================== */
    .msg.alif {
      background: linear-gradient(135deg, #bae6fd 0%, #67e8f9 32%, #22d3ee 52%, #3b82f6 82%, #2563ff 100%);
      border-color: #00e5ff;
      outline: 2px solid rgba(255,255,255,.85); outline-offset: -9px;
      padding: 22px 20px 18px;
      animation: neonPulse 2.2s ease-in-out infinite;
    }
    .msg.alif::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; z-index: 0;
      background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.8) 50%, transparent 80%);
      transform: skewX(-18deg); animation: sweep 2.8s ease-in-out infinite;
    }
    .msg.alif::after {
      content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(circle at 90% 10%, #fff 0 3px, transparent 4.5px),
        radial-gradient(circle at 76% 24%, #fff 0 2px, transparent 3.5px),
        radial-gradient(circle at 95% 42%, #fff 0 2.5px, transparent 4px),
        radial-gradient(circle at 84% 62%, #fff 0 2px, transparent 3.5px),
        radial-gradient(circle at 92% 86%, #fff 0 3px, transparent 4.5px),
        radial-gradient(circle at 66% 90%, #fff 0 2px, transparent 3.5px),
        radial-gradient(circle at 50% 12%, #fff 0 2px, transparent 3.5px),
        radial-gradient(circle at 36% 94%, #fff 0 2.5px, transparent 4px),
        radial-gradient(circle at 8% 78%, #fff 0 2px, transparent 3.5px),
        radial-gradient(circle at 12% 18%, #fff 0 2.5px, transparent 4px);
      filter: drop-shadow(0 0 4px #fff);
      animation: twinkleFast 1.5s ease-in-out infinite;
    }
    .msg.alif .who {
      font-size: 1.5rem; letter-spacing: .02em;
      text-shadow: 0 0 10px rgba(255,255,255,.95), 0 1px 0 rgba(255,255,255,.8);
    }
    /* bintang 4 sudut berkelip di samping nama */
    .msg.alif .who::after {
      content: ""; display: inline-block; width: 16px; height: 16px; margin-left: 8px; vertical-align: middle;
      background: #fff; filter: drop-shadow(0 0 5px #fff);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      animation: starBlink 1.2s ease-in-out infinite;
    }
    .msg.alif .meta { color: #0b2a5b; }

    @keyframes neonPulse {
      0%, 100% { box-shadow: 0 0 0 2px #00e5ff, 0 0 18px #00e5ff, 0 0 40px #2979ff, 0 0 64px rgba(41,121,255,.45); }
      50% { box-shadow: 0 0 0 3px #7df9ff, 0 0 32px #00e5ff, 0 0 62px #2979ff, 0 0 96px rgba(41,121,255,.75); }
    }
    @keyframes twinkleFast { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    @keyframes starBlink {
      0%, 100% { transform: scale(.6) rotate(0); opacity: .5; }
      50% { transform: scale(1.25) rotate(45deg); opacity: 1; }
    }

    @keyframes sweep { 0% { left: -60%; } 55%, 100% { left: 130%; } }
    @keyframes twinkle { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes glowPink {
      0%, 100% { box-shadow: 0 0 0 2px #f472b6, 0 0 16px rgba(236,72,153,.7), 0 0 34px rgba(59,130,246,.5); }
      50% { box-shadow: 0 0 0 2px #f9a8d4, 0 0 28px rgba(236,72,153,.95), 0 0 52px rgba(59,130,246,.75); }
    }
    @keyframes glowCyan {
      0%, 100% { box-shadow: 0 0 0 2px #22d3ee, 0 0 16px rgba(6,182,212,.75), 0 0 34px rgba(37,99,235,.5); }
      50% { box-shadow: 0 0 0 2px #67e8f9, 0 0 28px rgba(6,182,212,1), 0 0 52px rgba(37,99,235,.75); }
    }
    @media (prefers-reduced-motion: reduce) {
      .msg.rania, .msg.azfa, .msg.alif, .msg.rania::before, .msg.azfa::before, .msg.alif::before,
      .msg.rania::after, .msg.azfa::after, .msg.alif::after, .msg.alif .who::after { animation: none; }
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin Arsip</h1>
    <p class="muted">Alif's Birthday Archive</p>

    <!-- LOGIN -->
    <section class="panel" id="login-panel">
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <p class="error" id="login-error" hidden></p>
        <button type="submit" class="full" id="login-btn">Masuk</button>
      </form>
    </section>

    <!-- DASHBOARD -->
    <section id="dash" hidden>
      <div class="panel">
        <div class="bar">
          <strong>Pesan masuk</strong>
          <button type="button" id="logout-btn">Keluar</button>
        </div>
        <div class="filters">
          <div>
            <label for="year-select">Arsip tahun</label>
            <select id="year-select"></select>
          </div>
          <div>
            <label for="search">Cari</label>
            <input type="search" id="search" placeholder="Nama / isi pesan">
          </div>
        </div>
        <p class="error" id="dash-error" hidden></p>
      </div>

      <p class="count" id="count">-</p>
      <div id="list"></div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
